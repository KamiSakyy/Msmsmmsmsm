name: Build Tsuyu APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/tsuyu.keystore \
            -alias tsuyu -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tsuyu2026 -keypass tsuyu2026 \
            -dname "CN=Tsuyu, OU=Tsuyu, O=Tsuyu, L=Tokyo, S=Tokyo, C=JP"

      - name: Set up Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Run encryption unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Tsuyu-${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk out/Tsuyu.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tsuyu-APK
          path: out/*.apk
          retention-days: 90

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 14

      - name: Publish release
        if: github.ref_name == 'arena/01a09f1d-msmsmmsmsm'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tsuyu v1.0.${{ github.run_number }}
          body: |
            Tsuyu — сквозной мессенджер (Double Ratchet + X3DH, Firebase RTDB).
            Скачайте `Tsuyu.apk` и установите на Android 7.0+.
          files: out/*.apk
          generate_release_notes: false
