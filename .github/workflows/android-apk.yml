name: Build Tsuyu APK

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

concurrency:
  group: tsuyu-apk
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle') }}-${{ hashFiles('**/gradle.properties') }}

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build release APK
        working-directory: Tsuyu
        shell: bash
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          mkdir -p ../ci
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../ci/build.log
          ls -la app/build/outputs/apk/release/
          exit ${PIPESTATUS[0]}

      - name: Publish failure log (artifact + issue)
        if: failure()
        shell: bash
        run: |
          mkdir -p ci
          if [ -f ci/build.log ]; then
            tail -n 600 ci/build.log > ci/build-fail.log
          else
            echo "no build log captured" > ci/build-fail.log
          fi
          gh issue list --search "in:title CI-BUILD-LOG" --state open --json number --jq '.[0].number' > /tmp/issue_num 2>/dev/null || true
          ISSUE=$(cat /tmp/issue_num 2>/dev/null)
          BODY="Latest failed run: ${GITHUB_RUN_ID}
          Branch: ${GITHUB_REF_NAME}

          \`\`\`
          $(tail -n 350 ci/build-fail.log)
          \`\`\`"
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --title "CI-BUILD-LOG (auto)" --body "$BODY" || true
          else
            gh issue create --title "CI-BUILD-LOG (auto)" --body "$BODY" --label "bug" 2>/dev/null || gh issue create --title "CI-BUILD-LOG (auto)" --body "$BODY" || true
          fi

      - name: Upload failure log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: ci/build-fail.log
          if-no-files-found: ignore

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release
          cp Tsuyu/app/build/outputs/apk/release/app-release-unsigned.apk release/Tsuyu-v1.0.0.apk 2>/dev/null \
            || cp Tsuyu/app/build/outputs/apk/release/app-release.apk release/Tsuyu-v1.0.0.apk
          ls -la release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tsuyu-v1.0.0
          path: release/Tsuyu-v1.0.0.apk

      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Tsuyu-v1.0.0
          name: Tsuyu v1.0.0
          body: |
            Tsuyu — production messenger.
            - Double Ratchet E2EE (Signal-style), keys never leave the device
            - Text / photo / video / collage / voice / circles / music
            - P2P WebRTC calls, ghost mode, realtime everything
            - RTDB-only backend, base64 media
          files: release/Tsuyu-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
