name: Build Tsuyu APK

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

concurrency:
  group: tsuyu-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle') }}-${{ hashFiles('**/gradle.properties') }}

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build release APK
        working-directory: Tsuyu
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        shell: bash
        run: |
          set -e
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          gradle assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release
          cp Tsuyu/app/build/outputs/apk/release/app-release-unsigned.apk release/Tsuyu-v1.0.0.apk 2>/dev/null \
            || cp Tsuyu/app/build/outputs/apk/release/app-release.apk release/Tsuyu-v1.0.0.apk
          ls -la release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tsuyu-v1.0.0
          path: release/Tsuyu-v1.0.0.apk

      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Tsuyu-v1.0.0
          name: Tsuyu v1.0.0
          body: |
            Tsuyu — production messenger.
            - Double Ratchet E2EE (Signal-style), keys never leave the device
            - Text / photo / video / collage / voice / circles / music
            - P2P WebRTC calls, ghost mode, realtime everything
            - RTDB-only backend, base64 media
          files: release/Tsuyu-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
