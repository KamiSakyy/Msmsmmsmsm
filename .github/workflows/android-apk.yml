name: Build Tsuyu APK

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tsuyu-apk
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk: 34
          build-tools: 34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle') }}-${{ hashFiles('**/gradle.properties') }}

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Verify compile inputs
        shell: bash
        run: |
          set +e
          mkdir -p ci
          exec > >(tee ci/verify.log) 2>&1
          cd Tsuyu
          gradle :app:dependencies --configuration releaseCompileClasspath > /dev/null 2>&1
          echo "=== platform android-34 ==="
          PJ="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          ls -la "$PJ" 2>/dev/null
          echo "total entries: $(jar tf "$PJ" 2>/dev/null | grep -c class)"
          echo "app/Notification.class: $(jar tf "$PJ" 2>/dev/null | grep -c '^android/app/Notification.class$')"
          echo "app/RemoteInput.class: $(jar tf "$PJ" 2>/dev/null | grep -c '^android/app/RemoteInput.class$')"
          echo "SimpleOnDoubleTapListener: $(jar tf "$PJ" 2>/dev/null | grep -c 'SimpleOnDoubleTapListener')"
          echo "hardware/camera2: $(jar tf "$PJ" 2>/dev/null | grep -c 'hardware/camera2')"
          echo "=== webrtc aar ==="
          AAR=$(find ~/.gradle/caches -name "webrtc-124.0.0.aar" 2>/dev/null | head -1)
          echo "aar: $AAR"
          if [ -n "$AAR" ]; then
            mkdir -p /tmp/aarx && cd /tmp/aarx
            unzip -o -q "$AAR"
            echo "aar top-level:"; ls
            if [ -f classes.jar ]; then
              echo "classes.jar total: $(jar tf classes.jar | grep -c class)"
              echo "  android/: $(jar tf classes.jar | grep -c '^android/')"
              echo "  androidx/: $(jar tf classes.jar | grep -c '^androidx/')"
              echo "  org/webrtc/: $(jar tf classes.jar | grep -c '^org/webrtc/')"
              echo "  android/app/Notification.class: $(jar tf classes.jar | grep -c '^android/app/Notification.class$')"
            fi
          fi

      - name: Build release APK
        working-directory: Tsuyu
        shell: bash
        run: |
          export PATH=$ANDROID_SDK_ROOT/platform-tools:$PATH
          mkdir -p ../ci
          gradle assembleRelease --no-daemon 2>&1 | tee ../ci/build.log
          ls -la app/build/outputs/apk/release/
          exit ${PIPESTATUS[0]}

      - name: Publish failure log
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p ci
          if [ -f ci/build.log ]; then
            tail -n 600 ci/build.log > ci/build-fail.log
          else
            echo "no build log captured" > ci/build-fail.log
          fi
          echo "=== RUN ${GITHUB_RUN_ID} on ${GITHUB_REF_NAME} ===" > /tmp/faillog.txt
          if [ -f ci/verify.log ]; then echo "--- VERIFY ---" >> /tmp/faillog.txt; cat ci/verify.log >> /tmp/faillog.txt; fi
          cat ci/build-fail.log >> /tmp/faillog.txt
          git config user.name "tsuyu-ci"
          git config user.email "ci@tsuyu.app"
          git checkout -B ci-logs
          cp /tmp/faillog.txt ci-logs-fail.log
          git add ci-logs-fail.log
          git commit -m "ci-logs: run ${GITHUB_RUN_ID} [skip ci]"
          git push --force origin HEAD:refs/heads/ci-logs 2>&1 | tail -2
          GIST_URL=$(gh gist create ci/build-fail.log --public --desc "Tsuyu CI failure run ${GITHUB_RUN_ID}" 2>/dev/null)
          echo "gist: $GIST_URL"

      - name: Upload failure log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: ci/build-fail.log
          if-no-files-found: ignore

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release
          cp Tsuyu/app/build/outputs/apk/release/app-release-unsigned.apk release/Tsuyu-v1.0.0.apk 2>/dev/null \
            || cp Tsuyu/app/build/outputs/apk/release/app-release.apk release/Tsuyu-v1.0.0.apk
          ls -la release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tsuyu-v1.0.0
          path: release/Tsuyu-v1.0.0.apk

      - name: Snapshot sources to handof/
        shell: bash
        run: |
          set +e
          mkdir -p handof
          cd Tsuyu
          zip -rq ../handof/Tsuyu-src-run${GITHUB_RUN_NUMBER}.zip . -x "*/build/*" "*/.gradle/*"
          cd ..

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Tsuyu-v1.0.0
          name: Tsuyu v1.0.0
          files: |
            release/Tsuyu-v1.0.0.apk
            handof/Tsuyu-src-run${{ github.run_number }}.zip
