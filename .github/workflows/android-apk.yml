name: Build Tsuyu APK

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tsuyu-apk
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          unset ANDROID_HOME_ORIG
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          if [ ! -d latest/bin ]; then
            rm -rf cmdline-tools
            curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q tools.zip
            mv cmdline-tools latest
            rm tools.zip
          fi
          SM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SM --licenses > /dev/null 2>&1 || true
          good_jar() { [ -f "$1" ] && unzip -l "$1" 2>/dev/null | grep -q "hardware/camera2/CameraCaptureRequest.class"; }
          PICK=""; PICKSDK=""
          # 1) probe platforms already on the runner (incl. ext variants)
          for d in "$ANDROID_HOME"/platforms/android-3[0-9]*; do
            [ -f "$d/android.jar" ] || continue
            if good_jar "$d/android.jar"; then
              PICK="$d/android.jar"
              PICKSDK=$(basename "$d" | sed 's/android-//; s/-ext.*//')
              echo "found good preinstalled platform: $d"
              break
            fi
          done
          # 2) else try fresh installs 34 -> 30
          if [ -z "$PICK" ]; then
            for ver in 34 33 32; do
              rm -rf "$ANDROID_HOME/platforms/android-$ver"
              $SM --install "platforms;android-$ver" > /dev/null 2>&1 || true
              if good_jar "$ANDROID_HOME/platforms/android-$ver/android.jar"; then
                PICK="$ANDROID_HOME/platforms/android-$ver/android.jar"
                PICKSDK=$ver
                echo "fresh install OK: android-$ver"
                break
              fi
            done
          fi
          if [ -z "$PICK" ]; then
            echo "FATAL: no usable android.jar (probe: preinstalled + fresh 34/33/32)"
            for d in "$ANDROID_HOME"/platforms/android-*; do
              [ -f "$d/android.jar" ] && echo "  $d size=$(stat -c%s "$d/android.jar") camera2=$(unzip -l "$d/android.jar" | grep -c 'CameraCaptureRequest')"
            done
            exit 1
          fi
          # normalize to the plain platforms/android-<ver> dir
          TARGET="$ANDROID_HOME/platforms/android-$PICKSDK"
          if [ "$PICK" != "$TARGET/android.jar" ]; then
            rm -rf "$TARGET"
            mkdir -p "$TARGET"
            cp "$PICK" "$TARGET/android.jar"
          fi
          echo "USING compileSdk=$PICKSDK"
          echo "TSUYU_SDK=$PICKSDK" >> "$GITHUB_ENV"
          $SM --install "platform-tools" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle') }}-${{ hashFiles('**/gradle.properties') }}


      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Classpath diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p ci
          {
          echo "=== SDK platforms ==="
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || echo "no platforms dir"
          JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          if [ -f "$JAR" ]; then
            echo "android-34/android.jar size: $(stat -c%s "$JAR")"
            echo "  camera2: $(unzip -l "$JAR" | grep -c 'hardware/camera2/CameraCaptureRequest.class')"
            echo "  RemoteInput: $(unzip -l "$JAR" | grep -c 'app/RemoteInput.class')"
            echo "  Notification: $(unzip -l "$JAR" | grep -c 'app/Notification.class')"
          else
            echo "!!! android-34/android.jar MISSING !!!"
          fi
          echo "=== compile classpath shadow check ==="
          cd Tsuyu
          ./gradlew --version > /dev/null 2>&1 || gradle --version > /dev/null 2>&1
          gradle -q :app:printCompileCp 2>/dev/null > /tmp/cp.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if unzip -l "$f" 2>/dev/null | grep -qE "android/app/Notification.class"; then
              echo "SHADOWS android.app.Notification: $f"
            fi
            if unzip -l "$f" 2>/dev/null | grep -qE "org/webrtc/MediaStream.class"; then
              echo "PROVIDES org.webrtc.MediaStream: $f"
            fi
            if unzip -l "$f" 2>/dev/null | grep -qE "org/bouncycastle/crypto/agreements/X25519Agreement.class"; then
              echo "PROVIDES BC X25519Agreement: $f"
            fi
            if unzip -l "$f" 2>/dev/null | grep -qE "com/google/firebase/common/FirebaseAppOptions\$Builder.class"; then
              echo "PROVIDES FirebaseAppOptions: $f"
            fi
          done < /tmp/cp.txt
          echo "=== dependency tree (webrtc-related) ==="
          gradle :app:dependencies --configuration releaseCompileClasspath 2>/dev/null | grep -iE "webrtc|dafruits|android-" | sort -u | head -30
          echo "=== done ==="
          } 2>&1 | tee ci/diag.log

      - name: Build release APK
        working-directory: Tsuyu
        shell: bash
        run: |
          export PATH=$ANDROID_SDK_ROOT/platform-tools:$PATH
          mkdir -p ../ci
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../ci/build.log
          ls -la app/build/outputs/apk/release/
          exit ${PIPESTATUS[0]}

      - name: Publish failure log
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p ci
          if [ -f ci/build.log ]; then
            tail -n 600 ci/build.log > ci/build-fail.log
          else
            echo "no build log captured" > ci/build-fail.log
          fi
          echo "=== RUN ${GITHUB_RUN_ID} on ${GITHUB_REF_NAME} ===" > /tmp/faillog.txt
          if [ -f ci/diag.log ]; then echo "--- DIAGNOSTICS ---" >> /tmp/faillog.txt; cat ci/diag.log >> /tmp/faillog.txt; fi
          echo "--- BUILD LOG ---" >> /tmp/faillog.txt
          cat ci/build-fail.log >> /tmp/faillog.txt
          # channel 1: push to dedicated ci-logs branch (no workflow trigger on that branch)
          git config user.name "tsuyu-ci"
          git config user.email "ci@tsuyu.app"
          git checkout -B ci-logs
          cp /tmp/faillog.txt ci-logs-fail.log
          git add ci-logs-fail.log
          git commit -m "ci-logs: run ${GITHUB_RUN_ID} [skip ci]"
          git push --force origin HEAD:refs/heads/ci-logs 2>&1 | tail -2
          # channel 2: public gist
          GIST_URL=$(gh gist create ci/build-fail.log --public --desc "Tsuyu CI failure run ${GITHUB_RUN_ID}" 2>/dev/null)
          echo "gist: $GIST_URL"

      - name: Upload failure log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: ci/build-fail.log
          if-no-files-found: ignore

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release
          cp Tsuyu/app/build/outputs/apk/release/app-release-unsigned.apk release/Tsuyu-v1.0.0.apk 2>/dev/null \
            || cp Tsuyu/app/build/outputs/apk/release/app-release.apk release/Tsuyu-v1.0.0.apk
          ls -la release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tsuyu-v1.0.0
          path: release/Tsuyu-v1.0.0.apk

      - name: Snapshot sources to handof/
        shell: bash
        run: |
          set +e
          mkdir -p handof
          cd Tsuyu
          zip -rq ../handof/Tsuyu-src-run${GITHUB_RUN_NUMBER}.zip . -x "*/build/*" "*/.gradle/*"
          cd ..
          git config user.name "tsuyu-ci"
          git config user.email "ci@tsuyu.app"
          git add -f handof
          git commit -m "handof: source snapshot run ${GITHUB_RUN_NUMBER} [skip ci]" || echo "no changes"
          git pull --rebase origin HEAD 2>/dev/null || true
          git push origin HEAD:refs/heads/${GITHUB_REF#refs/heads/} || echo "push failed"

      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Tsuyu-v1.0.0
          name: Tsuyu v1.0.0
          body: |
            Tsuyu — production messenger.
            - Double Ratchet E2EE (Signal-style), keys never leave the device
            - Text / photo / video / collage / voice / circles / music
            - P2P WebRTC calls, ghost mode, realtime everything
            - RTDB-only backend, base64 media
          files: release/Tsuyu-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
